<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Expense Tracker By Z</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');
  body {
    font-family: 'Poppins', sans-serif;
    background: #FAF6F0;
    margin: 0;
    padding: 20px;
    color: #2B2B2B;
  }
  .container {
    max-width: 420px;
    margin: auto;
    background: #FFFFFF;
    border-radius: 20px;
    padding: 25px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.06);
  }
  h1 {
    text-align: center;
    font-size: 22px;
    margin-bottom: 20px;
  }
  .input-group {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
  }
  input {
    flex: 1;
    padding: 12px;
    border-radius: 12px;
    border: 1.5px solid #EAEAEA;
    outline: none;
    background: #FAF6F0;
  }
  button {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 12px;
    background: #2B2B2B;
    color: white;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #000; }
  .total-box {
    margin-top: 20px;
    background: #8A9A7B;
    color: white;
    padding: 15px;
    border-radius: 14px;
    text-align: center;
  }
  .total-box h2 { margin: 0; font-size: 16px; font-weight: 400; }
  .total-box p { margin: 5px 0 0; font-size: 28px; font-weight: 600; }
  .history {
    margin-top: 25px;
  }
  .history h3 {
    font-size: 16px;
    border-bottom: 1px solid #eee;
    padding-bottom: 8px;
  }
  .history-item {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid #F5F5F5;
    font-size: 14px;
  }
  .history-item span:last-child { font-weight: 600; }
  .delete-btn {
    background: transparent;
    color: #ff6b6b;
    width: auto;
    padding: 0 8px;
    font-size: 12px;
  }
  .clear-btn {
    margin-top: 15px;
    background: #FAF6F0;
    color: #2B2B2B;
    border: 1px solid #EAEAEA;
  }
</style>
</head>
<body>

<div class="container">
  <h1>Daily Expense Tracker</h1>
  
  <div class="input-group">
    <input type="text" id="itemName" placeholder="کس چیز پر خرچ کیا؟">
    <input type="number" id="itemPrice" placeholder="کتنے روپے؟">
  </div>
  <button onclick="addExpense()">Add Expense</button>

  <div class="total-box">
    <h2>آج کا کل خرچہ</h2>
    <p>Rs. <span id="todayTotal">0</span></p>
  </div>

  <div class="history">
    <h3>History</h3>
    <div id="historyList"></div>
    <button class="clear-btn" onclick="clearAll()">Clear All History</button>
  </div>
</div>

<script>
  let expenses = JSON.parse(localStorage.getItem('expensesByZ')) || [];

  function addExpense() {
    const name = document.getElementById('itemName').value;
    const price = parseFloat(document.getElementById('itemPrice').value);
    if (!name || !price) return alert('نام اور قیمت دونوں لکھو');

    const today = new Date().toLocaleDateString('en-GB');
    expenses.push({ name, price, date: today, id: Date.now() });
    localStorage.setItem('expensesByZ', JSON.stringify(expenses));
    
    document.getElementById('itemName').value = '';
    document.getElementById('itemPrice').value = '';
    render();
  }

  function render() {
    const historyList = document.getElementById('historyList');
    const today = new Date().toLocaleDateString('en-GB');
    let todayTotal = 0;
    historyList.innerHTML = '';

    expenses.slice().reverse().forEach(exp => {
      if (exp.date === today) todayTotal += exp.price;
      historyList.innerHTML += `
        <div class="history-item">
          <span>${exp.date} - ${exp.name}</span>
          <span>Rs. ${exp.price} <button class="delete-btn" onclick="deleteItem(${exp.id})">x</button></span>
        </div>`;
    });
    document.getElementById('todayTotal').innerText = todayTotal;
  }

  function deleteItem(id) {
    expenses = expenses.filter(e => e.id !== id);
    localStorage.setItem('expensesByZ', JSON.stringify(expenses));
    render();
  }

  function clearAll() {
    if(confirm('کیا ساری ہسٹری ڈیلیٹ کرنی ہے؟')) {
      expenses = [];
      localStorage.removeItem('expensesByZ');
      render();
    }
  }
  render();
</script>

</body>
</html>
