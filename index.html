<!DOCTYPE html>   
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Expense Tracker By Z</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f172a;--card:rgba(255,255,255,0.08);--border:rgba(255,255,255,0.12);--text:#e2e8f0;--accent:#38bdf8;--green:#34d399;--red:#fb7185}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Poppins',sans-serif;background:radial-gradient(1200px at 20% -10%,#1e3a8a 0%,transparent 60%),radial-gradient(1000px at 90% 10%,#0e7490 0%,transparent 60%),var(--bg);color:var(--text);min-height:100vh;padding:20px;transition:0.3s}
.container{max-width:1000px;margin:auto;animation:fadeIn 0.6s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
.header{text-align:center;margin-bottom:20px}
.header h1{font-size:32px;font-weight:700;letter-spacing:-0.5px}
.header h1 span{color:var(--accent)}
.header p{opacity:0.6;margin-top:6px;font-size:14px}
/* بیچ والا لینگویج بٹن */
.lang-switch{display:flex;justify-content:center;gap:12px;margin:20px 0}
.lang-switch button{padding:9px 22px;border-radius:999px;border:1px solid var(--border);background:var(--card);color:var(--text);font-weight:600;cursor:pointer;backdrop-filter:blur(12px);transition:0.2s}
.lang-switch button.active{background:linear-gradient(135deg,#38bdf8,#818cf8);color:#0f172a;border-color:transparent;box-shadow:0 6px 20px rgba(56,189,248,0.3)}
.grid{display:grid;grid-template-columns:1.2fr 0.8fr;gap:20px}
@media(max-width:850px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--border);border-radius:22px;padding:22px;backdrop-filter:blur(18px);box-shadow:0 12px 35px rgba(0,0,0,0.25)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}
.stat{padding:16px;border-radius:16px;background:rgba(255,255,255,0.05);border:1px solid var(--border);text-align:center}
.stat small{opacity:0.7;font-size:12px;letter-spacing:0.5px}
.stat h3{margin-top:6px;font-size:20px}
.stat.income h3{color:var(--green)}
.stat.expense h3{color:var(--red)}
label{display:block;margin:14px 0 6px;font-size:13px;opacity:0.8}
input,select{width:100%;padding:13px 14px;border-radius:12px;background:rgba(0,0,0,0.3);border:1px solid var(--border);color:var(--text);outline:none;font-family:inherit}
input:focus,select:focus{border-color:var(--accent)}
.btn{width:100%;margin-top:18px;padding:13px;border:none;border-radius:12px;background:linear-gradient(135deg,#38bdf8,#818cf8);color:#0f172a;font-weight:700;cursor:pointer;font-size:15px;transition:0.2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 25px rgba(56,189,248,0.3)}
.list{max-height:450px;overflow-y:auto;margin-top:12px;padding-right:4px}
.item{display:flex;justify-content:space-between;align-items:center;padding:14px;border-radius:14px;background:rgba(255,255,255,0.04);border:1px solid var(--border);margin-bottom:10px;animation:fadeIn 0.3s ease}
.del{cursor:pointer;opacity:0.6;border:none;background:transparent;color:var(--text);font-size:20px;padding:0 6px}
.del:hover{opacity:1;color:var(--red)}
.empty{text-align:center;padding:50px 10px;opacity:0.6}
.urdu{font-family:'Noto Nastaliq Urdu',serif}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1 id="title">Daily Expense <span>Tracker By Z</span></h1>
    <p id="subtitle">Manage your income & expenses beautifully</p>
  </div>

  <!-- یہ رہا بیچ والا اردو / انگلش بٹن -->
  <div class="lang-switch">
    <button id="btnEn" class="active" onclick="setLang('en')">English</button>
    <button id="btnUr" onclick="setLang('ur')">اردو</button>
  </div>

  <div class="stats">
    <div class="stat income"><small id="t-income">Total Income</small><h3 id="incomeVal">Rs 0</h3></div>
    <div class="stat expense"><small id="t-expense">Total Expense</small><h3 id="expenseVal">Rs 0</h3></div>
    <div class="stat"><small id="t-balance">Balance</small><h3 id="balanceVal">Rs 0</h3></div>
  </div>

  <div class="grid">
    <div class="card">
      <h3 id="t-add" style="margin-bottom:10px">Add Transaction</h3>
      <label id="l-type">Type</label>
      <select id="type"><option value="expense">Expense / خرچہ</option><option value="income">Income / آمدن</option></select>
      <label id="l-title">Title</label>
      <input id="titleInput" placeholder="e.g. Groceries, Salary">
      <label id="l-amount">Amount (Rs)</label>
      <input id="amountInput" type="number" placeholder="0">
      <label id="l-cat">Category</label>
      <select id="category"><option>Food</option><option>Transport</option><option>Shopping</option><option>Bills</option><option>Salary</option><option>Other</option></select>
      <button class="btn" onclick="addTransaction()" id="btnAdd">Add Transaction</button>
    </div>
    <div class="card">
      <h3 id="t-history">Transaction History</h3>
      <div class="list" id="list"></div>
    </div>
  </div>
</div>

<script>
let transactions = JSON.parse(localStorage.getItem('expenses_Z')||'[]');
let lang = localStorage.getItem('lang_Z')||'en';
const dict = {
 en:{title:'Daily Expense <span>Tracker By Z</span>',sub:'Manage your income & expenses beautifully',income:'Total Income',expense:'Total Expense',balance:'Balance',add:'Add Transaction',type:'Type',titleL:'Title',amount:'Amount (Rs)',cat:'Category',btn:'Add Transaction',history:'Transaction History',empty:'No transactions yet<br>ابھی کوئی ریکارڈ نہیں',ph:'e.g. Groceries, Salary'},
 ur:{title:'روزانہ خرچہ <span>ٹریکر</span>',sub:'اپنی آمدن اور خرچے کو خوبصورتی سے مینج کریں',income:'کل آمدن',expense:'کل خرچہ',balance:'بیلنس',add:'نیا اندراج',type:'قسم',titleL:'عنوان',amount:'رقم (روپے)',cat:'زمرہ',btn:'شامل کریں',history:'لین دین کی تاریخ',empty:'ابھی کوئی ریکارڈ نہیں',ph:'مثال: راشن، تنخواہ'}
};
function setLang(l){lang=l;localStorage.setItem('lang_Z',l);applyLang();}
function applyLang(){
 const t=dict[lang];
 document.getElementById('title').innerHTML=t.title;
 document.getElementById('subtitle').innerHTML=t.sub;
 document.getElementById('t-income').innerText=t.income;
 document.getElementById('t-expense').innerText=t.expense;
 document.getElementById('t-balance').innerText=t.balance;
 document.getElementById('t-add').innerText=t.add;
 document.getElementById('l-type').innerText=t.type;
 document.getElementById('l-title').innerText=t.titleL;
 document.getElementById('l-amount').innerText=t.amount;
 document.getElementById('l-cat').innerText=t.cat;
 document.getElementById('btnAdd').innerText=t.btn;
 document.getElementById('t-history').innerText=t.history;
 document.getElementById('titleInput').placeholder=t.ph;
 document.getElementById('btnEn').classList.toggle('active',lang==='en');
 document.getElementById('btnUr').classList.toggle('active',lang==='ur');
 document.body.classList.toggle('urdu',lang==='ur');
 render();
}
function addTransaction(){
 const type=document.getElementById('type').value;
 const title=document.getElementById('titleInput').value.trim();
 const amount=parseFloat(document.getElementById('amountInput').value);
 const cat=document.getElementById('category').value;
 if(!title||!amount)return alert(lang==='en'?'Please enter title and amount':'عنوان اور رقم لکھیں');
 transactions.unshift({id:Date.now(),type,title,amount,cat,date:new Date().toLocaleDateString()});
 localStorage.setItem('expenses_Z',JSON.stringify(transactions));
 document.getElementById('titleInput').value='';document.getElementById('amountInput').value='';
 render();
}
function deleteTx(id){transactions=transactions.filter(t=>t.id!==id);localStorage.setItem('expenses_Z',JSON.stringify(transactions));render();}
function render(){
 let inc=0,exp=0;transactions.forEach(t=>t.type==='income'?inc+=t.amount:exp+=t.amount);
 document.getElementById('incomeVal').innerText='Rs '+inc;
 document.getElementById('expenseVal').innerText='Rs '+exp;
 document.getElementById('balanceVal').innerText='Rs '+(inc-exp);
 const list=document.getElementById('list');
 if(transactions.length===0){list.innerHTML=`<div class="empty">${dict[lang].empty}</div>`;return;}
 list.innerHTML=transactions.map(t=>`
  <div class="item"><div style="display:flex;gap:10px;align-items:center"><div style="width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:${t.type==='income'?'rgba(52,211,153,0.15)':'rgba(251,113,133,0.15)'};color:${t.type==='income'?'#34d399':'#fb7185'}">${t.type==='income'?'↑':'↓'}</div><div><div style="font-weight:600">${t.title}</div><small style="opacity:0.6">${t.cat} • ${t.date}</small></div></div><div style="display:flex;align-items:center;gap:10px"><b style="color:${t.type==='income'?'var(--green)':'var(--red)'}">${t.type==='income'?'+':'-'}Rs ${t.amount}</b><button class="del" onclick="deleteTx(${t.id})">×</button></div></div>`).join('');
}
applyLang();
</script>
</body>
</html>
