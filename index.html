<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Expense Tracker By Z</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f172a;--card:rgba(255,255,255,0.08);--border:rgba(255,255,255,0.12);--text:#e2e8f0;--accent:#38bdf8;--green:#34d399;--red:#fb7185}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Poppins',sans-serif;background:radial-gradient(1200px at 20% -10%,#1e3a8a 0%,transparent 60%),radial-gradient(1000px at 90% 10%,#0e7490 0%,transparent 60%),var(--bg);color:var(--text);min-height:100vh;padding:20px}
.urdu{font-family:'Noto Nastaliq Urdu',serif;direction:rtl}
.container{max-width:950px;margin:auto}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.header h1{font-size:26px;font-weight:600}
.header h1 span{color:var(--accent)}
.lang-btn{background:var(--card);border:1px solid var(--border);color:var(--text);padding:8px 16px;border-radius:999px;cursor:pointer;backdrop-filter:blur(12px);font-weight:500}
.lang-btn:hover{background:rgba(255,255,255,0.15)}
.grid{display:grid;grid-template-columns:1.2fr 0.8fr;gap:20px}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:20px;backdrop-filter:blur(16px);box-shadow:0 10px 30px rgba(0,0,0,0.2)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.stat{padding:14px;border-radius:14px;background:rgba(255,255,255,0.05);border:1px solid var(--border)}
.stat small{opacity:0.7;font-size:12px}
.stat h3{margin-top:4px;font-size:18px}
.stat.income h3{color:var(--green)}
.stat.expense h3{color:var(--red)}
label{display:block;margin:12px 0 6px;font-size:13px;opacity:0.8}
input,select{width:100%;padding:12px 14px;border-radius:12px;background:rgba(0,0,0,0.25);border:1px solid var(--border);color:var(--text);outline:none}
input:focus,select:focus{border-color:var(--accent)}
.btn{width:100%;margin-top:16px;padding:12px;border:none;border-radius:12px;background:linear-gradient(135deg,#38bdf8,#818cf8);color:#0f172a;font-weight:600;cursor:pointer;font-size:15px}
.btn:hover{opacity:0.9}
.list{max-height:420px;overflow-y:auto;margin-top:10px}
.item{display:flex;justify-content:space-between;align-items:center;padding:12px;border-radius:12px;background:rgba(255,255,255,0.04);border:1px solid var(--border);margin-bottom:10px}
.item .left{display:flex;gap:10px;align-items:center}
.dot{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:16px}
.dot.inc{background:rgba(52,211,153,0.15);color:var(--green)}
.dot.exp{background:rgba(251,113,133,0.15);color:var(--red)}
.del{cursor:pointer;opacity:0.6;border:none;background:transparent;color:var(--text);font-size:18px}
.del:hover{opacity:1;color:var(--red)}
.empty{text-align:center;padding:40px 10px;opacity:0.6}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1 id="title">Daily Expense <span>Tracker By Z</span></h1>
    <button class="lang-btn" onclick="toggleLang()" id="langBtn">اردو</button>
  </div>

  <div class="stats">
    <div class="stat income"><small id="t-income">Income</small><h3 id="incomeVal">Rs 0</h3></div>
    <div class="stat expense"><small id="t-expense">Expense</small><h3 id="expenseVal">Rs 0</h3></div>
    <div class="stat"><small id="t-balance">Balance</small><h3 id="balanceVal">Rs 0</h3></div>
  </div>

  <div class="grid">
    <div class="card">
      <h3 id="t-add">Add Transaction</h3>
      <label id="l-type">Type</label>
      <select id="type"><option value="expense">Expense / خرچہ</option><option value="income">Income / آمدن</option></select>
      <label id="l-title">Title</label>
      <input id="titleInput" placeholder="e.g. Groceries, Salary">
      <label id="l-amount">Amount (Rs)</label>
      <input id="amountInput" type="number" placeholder="0">
      <label id="l-cat">Category</label>
      <select id="category">
        <option>Food</option><option>Transport</option><option>Shopping</option><option>Bills</option><option>Salary</option><option>Other</option>
      </select>
      <button class="btn" onclick="addTransaction()" id="btnAdd">Add Transaction</button>
    </div>

    <div class="card">
      <h3 id="t-history">History</h3>
      <div class="list" id="list"></div>
    </div>
  </div>
</div>

<script>
let transactions = JSON.parse(localStorage.getItem('expenses_Z')||'[]');
let lang = localStorage.getItem('lang_Z')||'en';

const dict = {
 en:{
  title:'Daily Expense <span>Tracker By Z</span>',
  income:'Income', expense:'Expense', balance:'Balance',
  add:'Add Transaction', type:'Type', titleL:'Title', amount:'Amount (Rs)', cat:'Category',
  btn:'Add Transaction', history:'History', empty:'No transactions yet<br>کوئی لین دین نہیں',
  placeholder:'e.g. Groceries, Salary', langBtn:'اردو'
 },
 ur:{
  title:'روزانہ خرچہ <span>ٹریکر</span>',
  income:'آمدن', expense:'خرچہ', balance:'بیلنس',
  add:'نیا اندراج شامل کریں', type:'قسم', titleL:'عنوان', amount:'رقم (روپے)', cat:'زمرہ',
  btn:'شامل کریں', history:'تاریخ', empty:'ابھی کوئی ریکارڈ نہیں',
  placeholder:'مثال: راشن، تنخواہ', langBtn:'English'
 }
};

function toggleLang(){
 lang = lang==='en'?'ur':'en';
 localStorage.setItem('lang_Z',lang);
 applyLang();
}
function applyLang(){
 const t = dict[lang];
 document.getElementById('title').innerHTML = t.title;
 document.getElementById('t-income').innerText = t.income;
 document.getElementById('t-expense').innerText = t.expense;
 document.getElementById('t-balance').innerText = t.balance;
 document.getElementById('t-add').innerText = t.add;
 document.getElementById('l-type').innerText = t.type;
 document.getElementById('l-title').innerText = t.titleL;
 document.getElementById('l-amount').innerText = t.amount;
 document.getElementById('l-cat').innerText = t.cat;
 document.getElementById('btnAdd').innerText = t.btn;
 document.getElementById('t-history').innerText = t.history;
 document.getElementById('langBtn').innerText = t.langBtn;
 document.getElementById('titleInput').placeholder = t.placeholder;
 document.body.classList.toggle('urdu', lang==='ur');
 render();
}
function addTransaction(){
 const type = document.getElementById('type').value;
 const title = document.getElementById('titleInput').value.trim();
 const amount = parseFloat(document.getElementById('amountInput').value);
 const cat = document.getElementById('category').value;
 if(!title || !amount) return alert(lang==='en'?'Please enter title and amount':'براہ کرم عنوان اور رقم درج کریں');
 transactions.unshift({id:Date.now(), type, title, amount, cat, date:new Date().toLocaleDateString()});
 localStorage.setItem('expenses_Z', JSON.stringify(transactions));
 document.getElementById('titleInput').value=''; document.getElementById('amountInput').value='';
 render();
}
function deleteTx(id){
 transactions = transactions.filter(t=>t.id!==id);
 localStorage.setItem('expenses_Z', JSON.stringify(transactions));
 render();
}
function render(){
 let inc=0, exp=0;
 transactions.forEach(t=> t.type==='income'? inc+=t.amount : exp+=t.amount);
 document.getElementById('incomeVal').innerText = 'Rs ' + inc;
 document.getElementById('expenseVal').innerText = 'Rs ' + exp;
 document.getElementById('balanceVal').innerText = 'Rs ' + (inc-exp);

 const list = document.getElementById('list');
 if(transactions.length===0){
   list.innerHTML = `<div class="empty">${dict[lang].empty}</div>`; return;
 }
 list.innerHTML = transactions.map(t=>`
  <div class="item">
   <div class="left">
    <div class="dot ${t.type==='income'?'inc':'exp'}">${t.type==='income'?'↑':'↓'}</div>
    <div><div style="font-weight:500">${t.title}</div><small style="opacity:0.6">${t.cat} • ${t.date}</small></div>
   </div>
   <div style="display:flex;align-items:center;gap:12px">
    <b style="color:${t.type==='income'?'var(--green)':'var(--red)'}">${t.type==='income'?'+':'-'}Rs ${t.amount}</b>
    <button class="del" onclick="deleteTx(${t.id})">×</button>
   </div>
  </div>
 `).join('');
}
applyLang();
</script>
</body>
</html>
